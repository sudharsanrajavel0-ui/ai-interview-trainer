<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AI Interview Trainer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon">AI</div>
            Interview Trainer
        </a>
        <div class="navbar-links">
            <a href="/">Home</a>
            <a href="/login">User Login</a>
        </div>
    </nav>

    <div class="page-center">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Admin Login</h1>
                    <p>Sign in to manage the application</p>
                </div>

                <div id="adminLoginError" class="alert alert-error hidden"></div>

                <form id="adminLoginForm">
                    <div class="form-group">
                        <label for="username">Username</label>
                        <input type="text" id="username" class="form-control" placeholder="Enter admin username" required autocomplete="username">
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter admin password" required autocomplete="current-password">
                    </div>

                    <button type="submit" id="adminLoginBtn" class="btn btn-primary" style="width: 100%;">
                        Sign In
                    </button>
                </form>
            </div>
        </div>
    </div>

    <script src="/static/js/admin.js"></script>
    <script>initAdminLoginPage();</script>
</body>
</html>
