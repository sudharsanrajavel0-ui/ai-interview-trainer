<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - AI Interview Trainer</title>
    <link rel="stylesheet" href="/static/css/style.css">
</head>
<body class="auth-page">
    <nav class="navbar">
        <a href="/" class="navbar-brand">
            <div class="logo-icon">AI</div>
            Interview Trainer
        </a>
        <div class="navbar-links">
            <a href="/login">Login</a>
            <a href="/admin">Admin</a>
            <a href="/register" class="btn btn-primary btn-sm">Get Started</a>
        </div>
    </nav>

    <div class="page-center">
        <div class="auth-container">
            <div class="auth-card">
                <div class="auth-header">
                    <h1>Welcome Back</h1>
                    <p>Sign in to continue your interview practice</p>
                </div>

                <div id="loginError" class="alert alert-error hidden"></div>

                <form id="loginForm">
                    <div class="form-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" class="form-control" placeholder="you@gmail.com" required>
                    </div>

                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
                    </div>

                    <!-- CHANGED: Password notification -->
                    <div id="passwordMessage" class="alert hidden" role="alert" aria-live="polite"></div>

                    <button type="submit" id="loginBtn" class="btn btn-primary" style="width: 100%;">
                        Sign In
                    </button>
                </form>

                <div class="auth-footer">
                    Don't have an account? <a href="/register">Create one here</a>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>initAuthPage();</script>
</body>
</html>
